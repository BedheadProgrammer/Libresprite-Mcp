services:
  libresprite-mcp:
    build: .
    volumes:
      - ./output:/app/output
    # MCP communicates over stdio – keep stdin open
    stdin_open: true
    environment:
      - LIBRESPRITE_MODE=docker
    # Limit resources to prevent runaway scripts
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
